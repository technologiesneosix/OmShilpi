<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Note: TopNav/BottomNav suppressed as this is a linear/transactional screen -->
<main class="flex-grow flex w-full">
<div class="hidden md:flex w-1/2 bg-surface-container-high relative">
<div class="w-full h-full bg-cover bg-center absolute inset-0" data-alt="A stunning, high-fashion editorial photograph of a South Asian model wearing an elaborate, heavy gold bridal necklace and intricate jhumka earrings. The lighting is soft and golden, illuminating the warm tones of her skin and the intricate craftsmanship of the jewelry. The background is a soft, out-of-focus champagne color, creating a luxurious, premium Indian wedding aesthetic. The overall mood is elegant, opulent, and refined." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDjIL6CC_6ZIJyZqZRkkO5RvzMkRyT2UT2-2t-CxKg6Qj3Wyzlw4n-SP22EIWnm0GzvNKLrV56qwT0CSpDnxAodU0PtOOOZM64UyNCn8Z8Iw1aY4R64Qo3m1pt9VeiJon_qoT4S3Z6DGCcdwpKhzZtEmvrmp9ph5GZ8tbzwleVrcTqlv8jAx9t9G8oJkxmSWByfe70NPwfdTWi-6jCfMaRQm3bzjnsWVPPtfZHbNDwIryo6RaRmpm0c')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-on-background/60 to-transparent"></div>
<div class="absolute bottom-12 left-12 right-12 text-on-primary">
<h2 class="font-h1 text-h1 mb-4">Timeless Elegance</h2>
<p class="font-body-lg text-body-lg opacity-90 max-w-md">Discover the finest craftsmanship and heritage in every piece.</p>
</div>
</div>
<div class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-12 md:p-gutter overflow-y-auto">
<div class="w-full max-w-md bg-surface-container rounded-xl p-8 border border-outline-variant">
<div class="text-center mb-8">
<h1 class="font-h2 text-h2 text-primary mb-2">Om Shilpi Jewels</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<!-- Login Form -->
<form class="space-y-6" id="loginForm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<input class="w-full bg-surface border-error text-on-surface rounded-DEFAULT px-4 py-3 focus:outline-none focus:ring-1 focus:ring-error transition-colors font-body-md" id="email" type="email" value="invalid-email-format"/>
<p class="font-meta text-meta text-error mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">error</span>
                            Invalid email format. Please enter a valid email.
                        </p>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<input class="w-full bg-surface border border-outline-variant text-on-surface rounded-DEFAULT px-4 py-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md" id="password" type="password"/>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded-sm border-outline-variant text-primary focus:ring-primary bg-surface" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant">Remember Me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md btn-text py-4 rounded-DEFAULT transition-all duration-300 custom-shadow-hover" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-4 font-meta text-meta text-on-surface-variant">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary font-label-md text-label-md hover:underline transition-all ml-1" href="#">Create Account</a>
</p>
</div>
</div>
</div>
